<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192.png" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Nest — Video courses with AI tutoring and timestamped Q&amp;A. Ask questions at any moment, get answers tied to the exact second." />
    <title>Nest</title>

    <!-- Social / link preview -->
    <meta property="og:title" content="Nest — learning that answers back" />
    <meta property="og:description" content="The tutor every African student can afford. Watch a lesson, ask a question at the exact second, get an answer from that lesson." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Installable app (PWA) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#6D4AE0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#6D4AE0" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Nest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700;800&family=Syne:wght@400;500;600;700;800&family=Inconsolata:wght@300;400;500;600&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300;1,9..144,400&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // A stuck pre-fix service worker (nest-v1, shipped before this app knew
      // how to recover from its own stale-chunk crashes) can keep controlling
      // a tab indefinitely — SW self-update only runs on navigation and isn't
      // guaranteed to complete on a device that never fully closes the PWA.
      // If a controller is active and it's an old version, wipe it out once
      // per session before the app bundle even loads.
      (function () {
        if (!('serviceWorker' in navigator) || !navigator.serviceWorker.controller) return;
        try {
          if (sessionStorage.getItem('nest_sw_bootstrap_wiped')) return;
        } catch (e) { return; }
        var chan = new MessageChannel();
        var answered = false;
        var timer = setTimeout(function () {
          if (answered) return;
          answered = true;
          wipe();
        }, 800);
        chan.port1.onmessage = function (e) {
          if (answered) return;
          answered = true;
          clearTimeout(timer);
          var m = e.data && /^nest-v(\d+)$/.exec(e.data.version || '');
          if (!m || Number(m[1]) < 2) wipe();
        };
        try {
          navigator.serviceWorker.controller.postMessage({ type: 'NEST_PING' }, [chan.port2]);
        } catch (e) {
          clearTimeout(timer);
          wipe();
        }
        function wipe() {
          try { sessionStorage.setItem('nest_sw_bootstrap_wiped', '1'); } catch (e) {}
          navigator.serviceWorker.getRegistrations()
            .then(function (regs) { return Promise.all(regs.map(function (r) { return r.unregister(); })); })
            .then(function () {
              return 'caches' in window ? caches.keys().then(function (keys) {
                return Promise.all(keys.map(function (k) { return caches.delete(k); }));
              }) : null;
            })
            .catch(function () {})
            .then(function () { window.location.reload(); });
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
