services:
  # ── Backend (FastAPI — Render web service) ────────────────────────────────────
  - type: web
    name: nest-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    # All values below are set in the Render dashboard (sync: false = not stored here).
    envVars:
      # Core
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL          # Supabase Postgres connection string
        sync: false
      - key: SECRET_KEY            # 32+ char random; app refuses to boot on a weak key
        sync: false
      - key: CORS_ORIGINS          # JSON array, e.g. ["https://nest-com.vercel.app"]
        sync: false
      - key: FRONTEND_URL          # used in email links, e.g. https://nest-com.vercel.app
        sync: false

      # AI
      - key: GROQ_API_KEY
        sync: false

      # Supabase storage (video / thumbnail uploads)
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false

      # Email — SendGrid is preferred; Resend is the fallback
      - key: SENDGRID_API_KEY
        sync: false
      - key: SENDGRID_FROM         # a verified single sender
        sync: false
      - key: RESEND_API_KEY        # optional fallback
        sync: false
      - key: ADMIN_NOTIFICATION_EMAIL   # where new-payment alerts go
        sync: false
